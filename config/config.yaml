app:
  name: "blockchain"
  version: "1.0.0"
  environment: "development"

database:
  driver: "mysql"
  dsn: "yurina:hirate@tcp(127.0.0.1:3306)/blockchain?parseTime=true&loc=Local"
  max_open_conns: 100
  max_idle_conns: 20
  conn_max_lifetime: "5m"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5

rabbitmq:
  url: "amqp://guest:guest@localhost:5672/"
  pool_size: 10

jwt:
  user_secret: "change-me-in-production"
  admin_secret: "change-me-in-production-admin"
  user_ttl: "24h"
  admin_ttl: "24h"
  cookie_max_age: "24h"

logger:
  level: "debug"
  path: ""

server:
  host: ""
  port: 3010
  shutdown_timeout: "30s"
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "http://localhost:3002"
