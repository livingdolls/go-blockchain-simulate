app:
  name: "blockchain"
  version: "1.0.0"
  environment: "development"

database:
  driver: "mysql"
  dsn: ""  # set via DATABASE_DSN env var atau config.local.yaml
  max_open_conns: 100
  max_idle_conns: 20
  conn_max_lifetime: "5m"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5

rabbitmq:
  url: ""  # set via RABBITMQ_URL env var atau config.local.yaml
  pool_size: 10

jwt:
  # user_secret dan admin_secret TIDAK boleh di-commit.
  # Set via env var (JWT_USER_SECRET, JWT_ADMIN_SECRET) atau
  # config.local.yaml. Validasi di config.go menolak nilai < 32 byte.
  # Kunci ada di sini dengan nilai kosong agar viper AllKeys()
  # mengenali kunci ini dan AutomaticEnv bisa bekerja.
  user_secret: ""  # set via JWT_USER_SECRET env var atau config.local.yaml
  admin_secret: ""  # set via JWT_ADMIN_SECRET env var atau config.local.yaml
  user_ttl: "24h"
  admin_ttl: "24h"
  cookie_max_age: "24h"

logger:
  level: "debug"
  path: ""

server:
  host: ""
  port: 3010
  shutdown_timeout: "30s"
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "http://localhost:3002"
